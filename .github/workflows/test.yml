name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: deps
        with:
          path: dependencies
          key: soldeer-${{ hashFiles('soldeer.lock') }}

      - if: steps.deps.outputs.cache-hit != 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - if: steps.deps.outputs.cache-hit != 'true'
        run: forge soldeer install

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge fmt --check

  build:
    name: Build
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/cache/restore@v4
        with:
          path: dependencies
          key: soldeer-${{ hashFiles('soldeer.lock') }}

      - run: forge build --sizes

  test:
    name: Tests
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/cache/restore@v4
        with:
          path: dependencies
          key: soldeer-${{ hashFiles('soldeer.lock') }}

      - run: forge test -vvv
