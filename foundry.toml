[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
cbor_metadata = false
bytecode_hash = "none"
# Local dev: consume the host-contracts-cleartext package (harness + engine) directly from the sibling repo.
allow_paths = ["../sdk/forge-fhevm", "../sdk/host-contracts-cleartext"]
auto_detect_remappings = false

[fuzz]
runs = 256

[fmt]
line_length = 120

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
"@openzeppelin-contracts-upgradeable" = "5.1.0"
forge-std = "1.14.0"
"@openzeppelin-confidential-contracts" = { version = "0.4.0", git = "https://github.com/OpenZeppelin/openzeppelin-confidential-contracts.git", rev = "v0.4.0" }
"@encrypted-types" = "0.0.4"
"@fhevm-solidity" = "0.11.1"

[soldeer]
remappings_version = false
recursive_deps = true
